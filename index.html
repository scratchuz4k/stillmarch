<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Stillmarch</title>
  <meta name="description" content="A living, JSON-driven reference for every system in Stillmarch — combat, houses, economy, sieges, crafting, and the build history behind them." />
  <link rel="icon" type="image/png" href="assets/stillmarch.png" />
  <link rel="apple-touch-icon" href="assets/stillmarch.png" />
  <meta name="theme-color" content="#0f1118" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="scrim" id="scrim"></div>
  <div class="app">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Open navigation"><span></span></button>
      <img class="topbar__logo" src="assets/stillmarch.png" alt="" width="26" height="26" />
      <span class="topbar__title" id="topbarTitle"></span>
    </header>

    <nav class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand__row">
          <img class="brand__logo" src="assets/stillmarch.png" alt="" width="40" height="40" />
          <span class="brand__mark" id="brandMark"></span>
        </div>
        <span class="brand__sub" id="brandSub"></span>
      </div>
      <input class="search" id="search" type="search" placeholder="Search systems&hellip;" autocomplete="off" />
      <label class="idea-toggle" for="hideIdeasToggle">
        <input type="checkbox" id="hideIdeasToggle" />
        <span>Hide backlog &amp; ideas</span>
      </label>
      <div class="nav-groups" id="navGroups"></div>
      <div class="sidebar__foot">
        <span>data/game-data.json</span>
        <button class="theme-toggle" id="themeToggle" type="button">&#9789; Dark</button>
      </div>
    </nav>

    <main class="main" id="main"></main>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
