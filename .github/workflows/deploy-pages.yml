name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# One Pages site, two apps:
#   /            -> dev/  (the systems reference, deployed as-is)
#   /preview/    -> web/  (the Vue landing page, unlisted)
env:
  PREVIEW_PATH: preview

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build landing page
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r dev/. _site/
          mkdir -p "_site/$PREVIEW_PATH"
          cp -r web/dist/. "_site/$PREVIEW_PATH/"
      # Pages caches everything for 10 minutes and dev/ uses fixed file names,
      # so stamp the commit SHA onto its asset URLs: each deploy gets fresh URLs
      # and browsers can't keep serving a stale app.js / style.css / game-data.json.
      - name: Cache-bust dev assets
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"(css/style\.css|js/app\.js)\"#\1=\"\2?v=$v\"#" _site/index.html
          sed -i "s#'data/game-data\.json'#'data/game-data.json?v=$v'#" _site/js/app.js
          grep -c "?v=$v" _site/index.html | grep -qx 2
          grep -q "game-data.json?v=$v" _site/js/app.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
